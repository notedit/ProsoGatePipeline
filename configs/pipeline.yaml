project: prosogate
paths:
  work_root: work
  output_root: tts_dataset
  manifests:
    ingest: work/01_ingest.jsonl
    audio_qc: work/02_audio_qc.jsonl
    resample: work/03_resample.jsonl
    vad_coarse: work/04_vad_coarse.jsonl
    asr: work/05_asr.jsonl
    text_normalize: work/06_text_normalize.jsonl
    align: work/07_align.jsonl
    fine_segment: work/08_fine_segment.jsonl
    spk_consistency: work/09_spk_consistency.jsonl
    f0: work/10_f0.jsonl
    rate: work/11_rate.jsonl
    filter_score: work/12_filter_score.jsonl
input:
  metadata_csv: examples/metadata.csv
  audio_root: examples/audio
  text_root: examples/text
audio_qc:
  studio:
    min_snr_db: 20
    max_clipping_ratio: 0.001
    min_effective_bw_hz: 7500
  podcast:
    min_snr_db: 12
    max_clipping_ratio: 0.005
    min_effective_bw_hz: 6000
  interview:
    min_snr_db: 10
    max_clipping_ratio: 0.005
    min_effective_bw_hz: 6000
  field:
    min_snr_db: 8
    max_clipping_ratio: 0.01
    min_effective_bw_hz: 6000
  loudness_lufs_range:
  - -35
  - -12
  min_duration_sec: 30
  smoke_test: true
resample:
  training_sr: 24000
  alignment_sr: 16000
vad_coarse:
  min_silence_ms: 500
  min_segment_sec: 10
  max_segment_sec: 30
  diarization:
    enabled: true
    model: pyannote/speaker-diarization-3.1
    snap_to_silence_ms: 200
    min_diar_confidence: 0.6
asr:
  model: Qwen3-ASR-1.7B
  language: zh
  with_punctuation: true
  batch_size: 8
  max_input_sec: 30
  device: cuda
  use_mock: true
align:
  model: Qwen3-ForcedAligner-0.6B
  granularity_ms: 50
  latency_offset_ms: 0
  audio_sample_rate: 16000
  min_char_confidence: 0.6
  min_high_conf_char_ratio: 0.85
  max_text_audio_duration_ratio: 1.4
  min_text_audio_duration_ratio: 0.6
  use_mock: true
fine_segment:
  min_duration: 3.0
  max_duration: 20.0
  preferred_min: 5.0
  preferred_max: 15.0
  punctuation_silence_ms: 200
spk_consistency:
  embedding_model: pyannote/embedding
  window_sec: 1.5
  hop_sec: 0.25
  min_windows: 4
  exclude_silence: true
  thresholds:
    cluster_silhouette: 0.35
    max_dist_to_center: 0.35
    max_neighbor_delta: 0.3
    consecutive_neighbor_delta: 0.2
    ref_outlier_ratio: 0.1
    overlap_ratio: 0.02
  enrollment:
    topk_per_speaker: 20
    update_min_score: 0.85
  use_mock: true
f0:
  frame_hop_ms: 10
  bootstrap:
    f0_min: 60
    f0_max: 600
  speaker_adaptive_range:
    factor_low: 0.5
    factor_high: 2.0
  filter:
    min_voiced_ratio: 0.45
    min_f0_confidence: 0.75
    max_f0_delta_p95_st: 6.0
    min_f0_std_st: 1.0
    max_f0_std_st: 10.0
    min_f0_range_st: 3.0
    max_f0_range_st: 20.0
  speaker_adaptive:
    enabled: true
    min_samples_per_speaker: 200
    keep_percentile:
    - 10
    - 95
rate:
  window_chars: 6
  step_chars: 3
  min_chars_for_local: 12
  filter:
    min_global_rate_cps: 2.0
    max_global_rate_cps: 8.0
    min_local_rate_cv: 0.06
    max_local_rate_cv: 0.65
    max_pause_ratio: 0.45
    max_long_pause_count_per_15s: 2
score:
  weights:
    audio: 0.25
    align: 0.2
    pitch: 0.25
    rate: 0.2
    text: 0.1
  pitch_optimal_std_st_range:
  - 2.0
  - 6.0
  pitch_delta_p95_full_score_range:
  - 0.0
  - 4.0
  pitch_delta_p95_zero_at: 6.0
  rate_optimal_cps_range:
  - 3.5
  - 6.0
  rate_optimal_cv_range:
  - 0.12
  - 0.45
  grade_thresholds:
    A: 0.85
    B: 0.75
    C: 0.6
split:
  ratios:
    train: 0.92
    valid: 0.04
    test: 0.04
  speaker_holdout: false
  dedup_similarity: 0.9
  random_seed: 42
